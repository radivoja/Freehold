server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/production/ {
        proxy_pass http://production:8090/;
    }

    location /api/marketplace/ {
        proxy_pass http://marketplace:8091/;
    }

    location /api/notification/ {
        proxy_pass http://notification:8092/;
    }

    location /api/order/ {
        proxy_pass http://order:8093/;
    }
}
