server.port=8091
spring.application.name=marketplace

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/freehold_marketplace}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:freehold}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:freehold}
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

# JWT (Cognito) — defense in depth
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI:}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${COGNITO_JWK_SET_URI:}

# AWS / MiniStack
aws.endpoint=${AWS_ENDPOINT:}
aws.region=${AWS_REGION:us-east-1}
sqs.queue.production-orders=${SQS_PRODUCTION_ORDERS:production-orders}
sqs.queue.production-results=${SQS_PRODUCTION_RESULTS:production-results}
dynamodb.table.audit-log=${DYNAMODB_AUDIT_LOG:audit-log}
s3.bucket.invoices=${S3_INVOICES_BUCKET:freehold-invoices}
sns.topic.order-notifications=${SNS_ORDER_NOTIFICATIONS_ARN:arn:aws:sns:us-east-1:000000000000:order-notifications}

# CloudWatch Metrics
cloudwatch.namespace=freehold/marketplace
cloudwatch.step=60s