services:

  register:
    build:
      context: .
      args:
        SERVICE: register
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  localstack:
    image: localstack/localstack:3.4
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs,dynamodb,s3,sns,cloudwatch
      DEFAULT_REGION: us-east-1
    volumes:
      - ./localstack:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/init/ready | grep -q SUCCESSFUL"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  production:
    build:
      context: .
      args:
        SERVICE: production
    ports:
      - "8090:8090"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://register:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      AWS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
    depends_on:
      register:
        condition: service_healthy
      localstack:
        condition: service_healthy

  market:
    build:
      context: .
      args:
        SERVICE: market
    ports:
      - "8091:8091"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://register:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      AWS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
    depends_on:
      register:
        condition: service_healthy
      localstack:
        condition: service_healthy

  customer:
    build:
      context: .
      args:
        SERVICE: customer
    ports:
      - "8092:8092"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://register:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      register:
        condition: service_healthy

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin
    container_name: dynamodb-admin
    ports:
      - "8001:8001"
    environment:
      DYNAMO_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      - localstack

  s3-browser:
    image: romanzdk/s3-web-browser
    container_name: s3-browser
    ports:
      - "8002:8000"
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      GUNICORN_CMD_ARGS: "--bind 0.0.0.0:8000"
    depends_on:
      localstack:
        condition: service_healthy

  customer-frontend:
    build: ./customer/frontend
    ports:
      - "3000:80"
    depends_on:
      - customer

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      localstack:
        condition: service_healthy