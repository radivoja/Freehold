services:

  register:
    build:
      context: .
      args:
        SERVICE: register
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  localstack:
    image: localstack/localstack:3.4
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs,dynamodb
      DEFAULT_REGION: us-east-1
    volumes:
      - ./localstack:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  production:
    build:
      context: .
      args:
        SERVICE: production
    ports:
      - "8090:8090"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://register:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      AWS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
    depends_on:
      register:
        condition: service_healthy
      localstack:
        condition: service_healthy

  market:
    build:
      context: .
      args:
        SERVICE: market
    ports:
      - "8091:8091"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://register:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      AWS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
    depends_on:
      register:
        condition: service_healthy
      localstack:
        condition: service_healthy

  customer:
    build:
      context: .
      args:
        SERVICE: customer
    ports:
      - "8092:8092"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://register:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      register:
        condition: service_healthy

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin
    container_name: dynamodb-admin
    ports:
      - "8001:8001"
    environment:
      DYNAMO_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      - localstack