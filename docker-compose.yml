services:

  ministack:
    image: ministackorg/ministack
    ports:
      - "4566:4566"
      - "4510:4510"
    environment:
      DEFAULT_REGION: us-east-1
    volumes:
      - ./ministack:/etc/ministack/init/boot.d
    healthcheck:
      test: [ "CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4566/')\"" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  ministack-init:
    image: ministackorg/ministack
    depends_on:
      ministack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    entrypoint: ["bash", "/init/01-init-aws.sh"]
    volumes:
      - ./ministack:/init
      - ./lambda:/lambda:ro

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: freehold
      POSTGRES_PASSWORD: freehold
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freehold"]
      interval: 5s
      timeout: 3s
      retries: 10

  production:
    build:
      context: .
      args:
        SERVICE: production
    ports:
      - "8090:8090"
    volumes:
      - ./ministack:/cognito:ro
    environment:
      AWS_ENDPOINT: http://ministack:4566
      AWS_REGION: us-east-1
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/freehold_production
      SPRING_DATASOURCE_USERNAME: freehold
      SPRING_DATASOURCE_PASSWORD: freehold
    depends_on:
      ministack-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  marketplace:
    build:
      context: .
      args:
        SERVICE: marketplace
    ports:
      - "8091:8091"
    volumes:
      - ./ministack:/cognito:ro
    environment:
      AWS_ENDPOINT: http://ministack:4566
      AWS_REGION: us-east-1
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/freehold_marketplace
      SPRING_DATASOURCE_USERNAME: freehold
      SPRING_DATASOURCE_PASSWORD: freehold
    depends_on:
      ministack-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  order:
    build:
      context: ./order
    ports:
      - "8093:8093"
    volumes:
      - ./ministack:/cognito:ro
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/freehold_order
      SPRING_DATASOURCE_USERNAME: freehold
      SPRING_DATASOURCE_PASSWORD: freehold
    depends_on:
      ministack-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  notification:
    build:
      context: ./notification
    ports:
      - "8092:8092"
    environment:
      AWS_ENDPOINT: http://ministack:4566
      AWS_REGION: us-east-1
      SQS_NOTIFICATION_QUEUE: notification-queue
    depends_on:
      ministack-init:
        condition: service_completed_successfully

  spa:
    build:
      context: ./spa
    ports:
      - "3000:80"
    volumes:
      - ./ministack:/cognito:ro
    depends_on:
      - production
      - marketplace
      - order
      - notification

  pgadmin:
    image: dpage/pgadmin4:8.13
    container_name: pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@freehold.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      ministack:
        condition: service_healthy