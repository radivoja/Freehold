services:

  ministack:
    image: ministackorg/ministack
    ports:
      - "4566:4566"
    environment:
      DEFAULT_REGION: us-east-1
    volumes:
      - ./ministack:/etc/ministack/init/boot.d
    healthcheck:
      test: [ "CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4566/')\"" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  ministack-init:
    image: ministackorg/ministack
    depends_on:
      ministack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    entrypoint: ["bash", "/init/01-init-aws.sh"]
    volumes:
      - ./ministack/01-init-aws.sh:/init/01-init-aws.sh

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: freehold
      POSTGRES_PASSWORD: freehold
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freehold"]
      interval: 5s
      timeout: 3s
      retries: 10

  production:
    build:
      context: .
      args:
        SERVICE: production
    ports:
      - "8090:8090"
    environment:
      AWS_ENDPOINT: http://ministack:4566
      AWS_REGION: us-east-1
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/freehold_production
      SPRING_DATASOURCE_USERNAME: freehold
      SPRING_DATASOURCE_PASSWORD: freehold
    depends_on:
      ministack-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  market:
    build:
      context: .
      args:
        SERVICE: market
    ports:
      - "8091:8091"
    environment:
      AWS_ENDPOINT: http://ministack:4566
      AWS_REGION: us-east-1
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/freehold_marketplace
      SPRING_DATASOURCE_USERNAME: freehold
      SPRING_DATASOURCE_PASSWORD: freehold
    depends_on:
      ministack-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      ministack:
        condition: service_healthy