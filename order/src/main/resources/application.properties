server.port=8093
server.servlet.context-path=/order
spring.application.name=order

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/freehold_order}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:freehold}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:freehold}
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

# JWT (Cognito) — defense in depth
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI:}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${COGNITO_JWK_SET_URI:}
