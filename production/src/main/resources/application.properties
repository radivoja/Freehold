server.port=8090
spring.application.name=production

# H2 Database
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:file:./data/production;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate

# Hibernate ddl auto (create, create-drop, validate, update)
# Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# AWS / LocalStack
aws.endpoint=${AWS_ENDPOINT:}
aws.region=${AWS_REGION:us-east-1}
sqs.queue.production-orders=${SQS_PRODUCTION_ORDERS:production-orders}
sqs.queue.production-results=${SQS_PRODUCTION_RESULTS:production-results}
dynamodb.table.audit-log=${DYNAMODB_AUDIT_LOG:audit-log}


# CloudWatch Metrics
cloudwatch.namespace=freehold/market
cloudwatch.step=60s
